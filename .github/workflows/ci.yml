name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact nightly + components.
      - name: Show toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets

  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace

  differential:
    name: differential vs Corretto 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Corretto 21 is the primary conformance oracle (§19.5). Oracle-backed tests
      # detect `java`/`javac` at runtime and run only when present (green elsewhere).
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
      - name: differential tests
        run: cargo test --workspace

  deny:
    name: cargo-deny (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: promote to hard gate once cargo-deny schema is pinned
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
